name: Deploy

on:
  push:
    branches:
      - release # production 환경
      - dev # develop 환경

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -v

  build-and-push:
    runs-on: ubuntu-24.04-arm # ARM64 native runner (에뮬레이션 오버헤드 제거)
    needs: test
    # 브랜치에 따라 환경 자동 선택
    environment: ${{ github.ref == 'refs/heads/release' && 'production' || 'develop' }}
    outputs:
      account-id: ${{ steps.aws.outputs.account_id }}
      sha-short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_SSMFULL_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/stolink/stolink-fastapi-image
          tags: |
            type=raw,value=${{ github.ref == 'refs/heads/release' && 'latest' || 'dev-latest' }}
            type=sha,prefix=${{ github.ref == 'refs/heads/release' && 'sha-' || 'dev-sha-' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    # 브랜치에 따라 환경 자동 선택
    environment: ${{ github.ref == 'refs/heads/release' && 'production' || 'develop' }}
    steps:
      - name: Checkout (for docker-compose.yml only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_SSMFULL_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ vars.MEDIA_S3_BUCKET_NAME }}
          CLOUDFRONT_URL: ${{ vars.CLOUDFRONT_URL }}
          AWS_BEDROCK_DEFAULT_REGION: ${{ vars.AWS_BEDROCK_DEFAULT_REGION }}
          AWS_BEDROCK_ACCESS_KEY_ID: ${{ secrets.AWS_BEDROCK_ACCESS_KEY_ID }}
          AWS_BEDROCK_SECRET_ACCESS_KEY: ${{ secrets.AWS_BEDROCK_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RABBITMQ_IMAGE_HOST: ${{ secrets.RABBITMQ_IMAGE_HOST }}
          RABBITMQ_IMAGE_PORT: ${{ vars.RABBITMQ_IMAGE_PORT }}
          RABBITMQ_IMAGE_USER: ${{ secrets.RABBITMQ_IMAGE_USER }}
          RABBITMQ_IMAGE_PASSWORD: ${{ secrets.RABBITMQ_IMAGE_PASSWORD }}
          RABBITMQ_IMAGE_VHOST: ${{ vars.RABBITMQ_IMAGE_VHOST }}
          # ECR 이미지 정보
          AWS_ACCOUNT_ID: ${{ needs.build-and-push.outputs.account-id }}
          # 브랜치에 따라 이미지 태그 결정 (SSM 배포용)
          IMAGE_TAG: ${{ github.ref == 'refs/heads/release' && 'latest' || 'dev-latest' }}
          # Parameter Store용 고유 SHA 태그 (ASG 신규 인스턴스용 - ECR 태그와 일치)
          UNIQUE_TAG: ${{ github.ref == 'refs/heads/release' && format('sha-{0}', needs.build-and-push.outputs.sha-short) || format('dev-sha-{0}', needs.build-and-push.outputs.sha-short) }}
        run: |
          # .env 파일 내용 생성
          ENV_CONTENT="AWS_REGION=${AWS_REGION}
          AWS_S3_REGION=${AWS_REGION}
          AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
          CLOUDFRONT_URL=${CLOUDFRONT_URL}
          AWS_BEDROCK_DEFAULT_REGION=${AWS_BEDROCK_DEFAULT_REGION}
          AWS_BEDROCK_ACCESS_KEY_ID=${AWS_BEDROCK_ACCESS_KEY_ID}
          AWS_BEDROCK_SECRET_ACCESS_KEY=${AWS_BEDROCK_SECRET_ACCESS_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          RABBITMQ_IMAGE_HOST=${RABBITMQ_IMAGE_HOST}
          RABBITMQ_IMAGE_PORT=${RABBITMQ_IMAGE_PORT}
          RABBITMQ_IMAGE_USER=${RABBITMQ_IMAGE_USER}
          RABBITMQ_IMAGE_PASSWORD=${RABBITMQ_IMAGE_PASSWORD}
          RABBITMQ_IMAGE_VHOST=${RABBITMQ_IMAGE_VHOST}
          RABBITMQ_IMAGE_QUEUE=stolink.image.queue
          IMAGE_NAME=${AWS_ACCOUNT_ID}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/stolink/stolink-fastapi-image:${UNIQUE_TAG}"

          # docker-compose.yml 내용 읽기
          COMPOSE_CONTENT=$(cat docker-compose.yml)

          # Base64로 인코딩하여 SSM으로 전달 (특수문자 이스케이프 문제 해결)
          ENV_BASE64=$(echo "$ENV_CONTENT" | base64 -w 0)
          COMPOSE_BASE64=$(echo "$COMPOSE_CONTENT" | base64 -w 0)

          # Parameter Store에 저장 (ASG 신규 인스턴스 자동 설정용)
          ENV_PATH=${{ github.ref == 'refs/heads/release' && '/prod' || '/dev' }}/stolink-fastapi-image
          aws ssm put-parameter --name "${ENV_PATH}/env" --value "$ENV_CONTENT" --type SecureString --overwrite
          aws ssm put-parameter --name "${ENV_PATH}/docker-compose" --value "$COMPOSE_CONTENT" --type String --overwrite
          echo "✅ Parameter Store updated: ${ENV_PATH}"

          # SSM 명령 실행 및 Command ID 캡처
          # dev 브랜치: dev-fastapi-image 태그, release 브랜치: stolink-fastapi-image 태그
          EC2_TAG=${{ github.ref == 'refs/heads/release' && 'stolink-fastapi-image' || 'dev-fastapi-image' }}

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:tag,Values=${EC2_TAG}" \
            --parameters "commands=[
              \"sudo -i -u ubuntu bash -c 'mkdir -p /home/ubuntu/stolink-fastapi-image'\",
              \"sudo rm -f /home/ubuntu/stolink-fastapi-image/.env && echo '${ENV_BASE64}' | base64 -d | sudo -u ubuntu tee /home/ubuntu/stolink-fastapi-image/.env > /dev/null\",
              \"sudo rm -f /home/ubuntu/stolink-fastapi-image/docker-compose.yml && echo '${COMPOSE_BASE64}' | base64 -d | sudo -u ubuntu tee /home/ubuntu/stolink-fastapi-image/docker-compose.yml > /dev/null\",
              \"sudo -i -u ubuntu bash -c 'aws ecr get-login-password --region ap-northeast-2 | sudo docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com'\",
              \"sudo -i -u ubuntu bash -c 'cd /home/ubuntu/stolink-fastapi-image && sudo docker compose down --remove-orphans && sudo docker compose up -d --pull always && sudo docker image prune -f'\"
            ]" \
            --timeout-seconds 300 \
            --max-concurrency "50%" \
            --max-errors "0" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # SSM 명령 완료 대기 (최대 5분)
          echo "Waiting for SSM command to complete..."
          for i in {1..30}; do
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].Status" --output text)
            echo "Attempt $i/30: Status = $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ SSM command completed successfully"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ SSM command failed with status: $STATUS"
              # 실패 시 상세 로그 출력
              aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
              exit 1
            fi

            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "❌ SSM command did not complete in time. Last status: $STATUS"
            exit 1
          fi
