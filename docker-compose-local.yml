# StoLink Image Worker - Local Development Docker Compose
# RabbitMQ를 로컬에서 함께 실행하는 개발용 설정
#
# 사용법:
# 1. 환경변수 설정: cp .env.example .env 후 값 입력
# 2. 빌드 및 실행: docker compose -f docker-compose-local.yml up --build -d
# 3. 중지: docker compose -f docker-compose-local.yml down
# 4. 데이터 삭제 포함 중지: docker compose -f docker-compose-local.yml down -v
# 5. 로그 확인: docker compose -f docker-compose-local.yml logs -f image-worker
# 6. RabbitMQ 관리 UI: http://localhost:15672 (guest/guest)

services:
  # RabbitMQ Message Broker (로컬 개발용)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: stolink-rabbitmq-local
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: stolink
    volumes:
      - rabbitmq_local_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - stolink-local-network

  # Image Worker (FastAPI)
  image-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stolink-image-worker-local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # RabbitMQ는 로컬 컨테이너 사용
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: stolink
      RABBITMQ_IMAGE_QUEUE: stolink.image.queue
      # Debug mode
      DEBUG: "true"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - stolink-local-network
    restart: unless-stopped
    # volumes:
    #   # 로컬 소스 코드 마운트 (핫 리로드용, 선택사항)
    #   - ./app:/app/app:ro

volumes:
  rabbitmq_local_data:

networks:
  stolink-local-network:
    driver: bridge
